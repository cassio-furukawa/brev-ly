services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brevly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brevly']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: always
    ports:
      - '3333:3333'
    environment:
      PORT: 3333
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/brevly
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    # Roda a migration antes de subir o servidor, toda vez que o container inicia.
    # Migrations já aplicadas são ignoradas pelo Drizzle, então é seguro rodar sempre.
    command: sh -c "npm run db:migrate:prod && npm run start"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5173:5173'
    environment:
      VITE_BACKEND_URL: http://localhost:3333
      VITE_FRONTEND_URL: http://localhost:5173
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - server
    # Reinstala as dependências a cada início, garantindo que o node_modules
    # do volume sempre reflita o package.json atual (evita libs "fantasma").
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
